project_id = "aznif"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "dominoapp://auth-callback"
additional_redirect_urls = ["dominoapp://**", "dominoapp://auth-callback?flow=recovery"]
enable_signup = true

[functions.process_bot_turns]
verify_jwt = false

[functions.okey_room]
verify_jwt = true

[functions.okey_match]
verify_jwt = true

[functions.okey_maintenance]
verify_jwt = false

[functions.submit_one_vs_one]
verify_jwt = true

[functions.submit_two_vs_two]
verify_jwt = true

[functions.delete_account]
verify_jwt = true
[functions.dama_action]
verify_jwt = true

[functions.dama_lifecycle]
  verify_jwt = false

[functions.dama_match]
  verify_jwt = true
[auth.email.template.recovery]
subject = "Reset your Aznif password"
content_path = "./supabase/templates/recovery.html"

[functions.send-push-notification]
verify_jwt = false
